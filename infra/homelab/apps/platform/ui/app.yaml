---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ui
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: https://github.com/ininicho/platform.git
      path: charts/ui
      targetRevision: main
      helm:
        valueFiles: [$values/infra/homelab/apps/platform/ui/values.yaml]
    - repoURL: https://github.com/ininicho/ininicho.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true]
